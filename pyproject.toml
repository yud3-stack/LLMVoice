[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "LLMVoice"
version = "0.1.8"
description = "Offline, local-first long-form voice cloning CLI for Windows"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yusuf Dere" }]
dependencies = [
  "platformdirs>=4.3,<5",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
tts = [
  "coqui-tts>=0.27.5,<0.28",
  "transformers>=4.57,<5",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
llmvoice = "llmvoice.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["llmvoice"]

[tool.hatch.build.targets.sdist]
include = [
  "/llmvoice",
  "/installer",
  "/scripts",
  "/tests",
  "/samples/.gitkeep",
  "/samples/transcript.txt",
  "/README.md",
  "/LICENSE",
  "/THIRD_PARTY_LICENSES.md",
  "/constraints.txt",
  "/pyproject.toml",
]

[tool.llmvoice.release]
schema-version = 2
repository = "yud3-stack/LLMVoice"

[[tool.llmvoice.release.runtime-profiles.cuda.groups]]
name = "compute"
index-url = "https://download.pytorch.org/whl/cu130"
packages = [
  "torch==2.11.0+cu130",
  "torchaudio==2.11.0+cu130",
]
no-dependencies = false

[[tool.llmvoice.release.runtime-profiles.cuda.groups]]
name = "codec"
index-url = "https://download.pytorch.org/whl/cpu"
packages = ["torchcodec==0.13.0+cpu"]
no-dependencies = true

[[tool.llmvoice.release.runtime-profiles.cpu.groups]]
name = "runtime"
index-url = "https://download.pytorch.org/whl/cpu"
packages = [
  "torch==2.11.0+cpu",
  "torchaudio==2.11.0+cpu",
  "torchcodec==0.13.0+cpu",
]
no-dependencies = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = [
  "integration: requires local FFmpeg/FFprobe binaries",
]
