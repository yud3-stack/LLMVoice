name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, build, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate tag against package metadata
        run: python scripts/release.py validate-tag --tag "$GITHUB_REF_NAME"

      - name: Install release dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run release test gate
        run: |
          python -m pytest
          python -m pytest -m integration

      - name: Compile package
        run: python -m compileall -q llmvoice scripts

      - name: Validate dependency environment
        run: python -m pip check

      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "installer/install.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Build wheel and source distribution
        run: python -m build

      - name: Prepare signed-by-checksum release asset set
        run: |
          python scripts/release.py prepare \
            --tag "$GITHUB_REF_NAME" \
            --dist-dir dist \
            --installer installer/install.ps1 \
            --output-dir release-assets

      - name: Validate release artifacts
        run: |
          python scripts/release.py validate \
            --tag "$GITHUB_REF_NAME" \
            --assets-dir release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            --verify-tag \
            --title "LLMVoice $GITHUB_REF_NAME" \
            --generate-notes
