name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-installer-tests:
    name: Windows PowerShell 5.1 installer tests
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Parse installer and run Python detection regressions
        shell: powershell
        run: |
          .\tests\powershell\test_python_detection.ps1 `
            -InstallerPath .\installer\install.ps1

  quality:
    name: Unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest

      - name: Compile package
        run: python -m compileall -q llmvoice

      - name: Validate dependency environment
        run: python -m pip check

      - name: Build source and wheel distributions
        run: python -m build

  integration-ffmpeg:
    name: FFmpeg integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run FFmpeg integration tests
        run: python -m pytest -m integration
