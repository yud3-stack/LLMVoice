[package]
name = "llmvoice-studio"
version = "0.1.0"
description = "Local voice production studio"
authors = ["LLMVoice"]
edition = "2021"

[lib]
name = "llmvoice_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
